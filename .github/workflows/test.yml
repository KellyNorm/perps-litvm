name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # The RedStone oracle tests run with ffi = true and shell out to
      # test/ffi/redstone-mock-payload.js, which requires @redstone-finance/evm-connector
      # from the root package.json. Without this the FFI call exits 1 and those suites
      # fail. Previously invisible: the size gate killed the job before the test step.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x # root package.json engines: >=20 <23
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FFI test dependencies
        run: npm ci

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build

      # EIP-170 caps *deployed* runtime bytecode. Test harnesses in test/*.t.sol are
      # never broadcast, so including them made the gate fail on contracts the limit
      # cannot apply to. Scoped to deployable code, it now fails only when something
      # we actually ship crosses 24,576 bytes — which matters, because PositionManager
      # sits at 23,919 (+657, ~2.7% headroom). The build step above still compiles the
      # tests, so a broken harness is still caught.
      - name: Check deployed contract sizes (EIP-170)
        run: forge build --sizes --skip test --skip script

      - name: Run Forge tests
        run: forge test -vvv

  # Separate job for the same reason the frontend one is separate, and for a second reason
  # specific to this service: quest-indexer/ is a deployable that must stay independent of
  # keeper/ and frontend/, and its own test job is part of how that stays true. Its
  # isolation suite fails if the service ever grows a signer or an import across the
  # deployable boundary.
  quest-indexer:
    name: Quest indexer tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: quest-indexer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x # matches quest-indexer/package.json engines
          cache: npm
          cache-dependency-path: quest-indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Separate job on purpose: the Foundry job is red on a known EIP-170 contract-size
  # gap (see #4), and a suite folded into it would be invisible behind that red. This
  # reports its own status so a JS regression is distinguishable from the known gap.
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x # matches frontend/package.json engines and the Vercel runtime
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
